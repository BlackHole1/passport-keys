name: Publish

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Expected version (for example 1.2.3). Leave empty to auto-bump from the latest tag.
        required: false
        type: string
        default: ""
      version_bump:
        description: Version segment to bump when expected_version is empty.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag_name: ${{ steps.compute.outputs.tag_name }}
      previous_tag: ${{ steps.compute.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute Version
        id: compute
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: python3 contrib/ci/release_version.py

  build-macos:
    needs: compute-version
    name: Build macOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build, sign, and package
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: macos/scripts/release.sh

      - name: Upload app package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos
          path: macos/build/release/*
          if-no-files-found: error

  build-firmware:
    needs: compute-version
    name: Build firmware
    runs-on: ubuntu-latest
    env:
      # 由 validate.sh 传给 idf.py,写入应用描述,即固件 hello 消息里的 ver。
      PROJECT_VER: ${{ needs.compute-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          path: firmware
          extra_docker_args: -e PROJECT_VER
          command: ./tools/validate.sh --firmware

      - name: Package firmware
        run: |
          mkdir -p dist
          cp firmware/build/FoloToy-AI-Passport-full.bin "dist/passport-keys-firmware-${PROJECT_VER}.bin"

      - name: Upload firmware
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-firmware
          path: dist/*
          if-no-files-found: error

  publish:
    needs:
      - compute-version
      - build-macos
      - build-firmware
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.compute-version.outputs.version }}
      RELEASE_TAG: ${{ needs.compute-version.outputs.tag_name }}
      PREVIOUS_TAG: ${{ needs.compute-version.outputs.previous_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Write checksums
        working-directory: dist/release
        run: sha256sum -- *.zip *.bin > SHA256SUMS

      - name: Ensure GitHub Release
        run: python3 contrib/ci/github_release.py dist/release/*
